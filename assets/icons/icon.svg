<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#234233" />
      <stop offset="100%" stop-color="#172d22" />
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c89666" />
      <stop offset="100%" stop-color="#8b5a2b" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Square -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <!-- Little Library Roof -->
  <path d="M256 68 L84 196 H428 Z" fill="url(#woodGrad)" stroke="#FAF6F0" stroke-width="10" stroke-linejoin="round" />
  <!-- Library Cabinet Body -->
  <rect x="116" y="196" width="280" height="228" rx="12" fill="#FAF6F0" stroke="url(#woodGrad)" stroke-width="14" />
  <!-- Wooden Shelf Middle -->
  <rect x="122" y="308" width="268" height="16" fill="url(#woodGrad)" />
  <!-- Books Top Shelf -->
  <rect x="148" y="224" width="34" height="84" rx="5" fill="#2e7d32" />
  <rect x="188" y="234" width="30" height="74" rx="5" fill="#1565c0" />
  <rect x="224" y="218" width="38" height="90" rx="5" fill="#f9a825" />
  <rect x="274" y="228" width="32" height="80" rx="5" fill="#9e2a2b" transform="rotate(-8 274 228)" />
  <!-- Books Bottom Shelf -->
  <rect x="150" y="338" width="42" height="76" rx="5" fill="#234233" />
  <rect x="198" y="346" width="32" height="68" rx="5" fill="#d97706" />
  <rect x="236" y="334" width="36" height="80" rx="5" fill="#1e40af" />
  <rect x="278" y="342" width="48" height="72" rx="5" fill="#15803d" />
  <!-- Post Support -->
  <rect x="232" y="424" width="48" height="44" rx="4" fill="url(#woodGrad)" />
</svg>
